name: pakailagi
description: PakaiLagi — platform berbagi barang bekas layak pakai secara gratis.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  geocoding: ^2.1.1
  geolocator: ^10.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.2.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
