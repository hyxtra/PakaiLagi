name: P11 CI and Release APK

on:
  push:
    branches: [v1.0_dev, V1.1]
  pull_request:
    branches: [v1.0_dev, V1.1]

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests (200 total)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded

  build-and-deploy:
    name: Release APK
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure release keystore (if secrets set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::KEYSTORE_PASSWORD, KEY_ALIAS, atau KEY_PASSWORD belum diisi di GitHub Secrets."
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/release-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release keystore configured."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; falling back to debug signing."
          fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pakailagi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
