name: P11 CI and Release APK

on:
  push:
    branches: [v1.0_dev, V1.1]
  pull_request:
    branches: [v1.0_dev, V1.1]

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests (200 total)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded

  build-and-deploy:
    name: Release APK
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pakailagi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
